<!DOCTYPE html>
<html lang="id">
<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><script src="/version-checker.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Gambar (Maksimal 2MB)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
    }

    h2 {
      font-size: 18px;
      color: #111827;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label.form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .file-input-wrapper {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      background-color: #fafafa;
      transition: all 0.2s ease;
    }

    .file-input-wrapper:hover {
      border-color: #2563eb;
      background-color: #eff6ff;
    }

    .file-input-wrapper.is-invalid {
      border-color: #dc2626 !important;
      background-color: #fef2f2 !important;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .btn-choose {
      display: inline-block;
      padding: 8px 16px;
      background-color: #2563eb;
      color: white;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .file-hint {
      font-size: 12px;
      color: #6b7280;
      display: block;
    }

    /* Peringatan berwarna merah di bawah input */
    .alert-error {
      display: none;
      color: #dc2626;
      background-color: #fee2e2;
      border: 1px solid #f87171;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Preview Gambar */
    .preview-box {
      display: none;
      margin-top: 14px;
      text-align: center;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      object-fit: cover;
    }

    .file-name-text {
      font-size: 12px;
      color: #4b5563;
      margin-top: 6px;
    }

    .btn-upload {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-upload:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Upload Gambar</h2>
    <p class="subtitle">Pilih file gambar dengan ukuran maksimal 2 MB.</p>

    <div class="form-group">
      <label class="form-label" for="gambarInput">File Gambar:</label>

      <div class="file-input-wrapper" id="dropArea" onclick="document.getElementById('gambarInput').click();">
        <div class="btn-choose">Pilih Gambar</div>
        <span style="font-size: 11px; color: #6b7280; display: block; margin-bottom: 4px; font-weight: 600;">MAX 2Mb</span>
        <span class="file-hint" id="statusText">Klik di sini untuk memilih gambar</span>
        <input type="file" id="gambarInput" accept="image/*" />
      </div>

      <!-- Teks peringatan berwarna merah langsung di bawahnya -->
      <div class="alert-error" id="errorMessage">
        ⚠️ Ukuran file melebihi batas maksimal 2MB! Silakan pilih gambar yang berukuran di bawah 2MB.
      </div>
    </div>

    <!-- Preview jika ukuran gambar valid -->
    <div class="preview-box" id="previewArea">
      <img id="previewImg" src="" alt="Preview Gambar" />
      <div class="file-name-text" id="previewName"></div>
    </div>

    <button type="button" class="btn-upload" id="uploadBtn" disabled>Upload ke Server</button>
  </div>

  <script>
    const MAX_SIZE = 2 * 1024 * 1024; // 2 MB (2.097.152 bytes)

    const fileInput = document.getElementById('gambarInput');
    const dropArea = document.getElementById('dropArea');
    const errorMessage = document.getElementById('errorMessage');
    const previewArea = document.getElementById('previewArea');
    const previewImg = document.getElementById('previewImg');
    const previewName = document.getElementById('previewName');
    const statusText = document.getElementById('statusText');
    const uploadBtn = document.getElementById('uploadBtn');

    let currentFile = null;

    fileInput.addEventListener('change', function(e) {
      const file = this.files && this.files[0];
      if (!file) return;

      // Cek apakah file melebihi 2MB
      if (file.size > MAX_SIZE) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        
        // Tampilkan teks peringatan berwarna merah di bawahnya
        errorMessage.innerText = '⚠️ Ukuran file (' + sizeMB + ' MB) melebihi batas maksimal 2MB! Silakan pilih gambar yang lebih kecil.';
        errorMessage.style.display = 'block';

        // Beri border merah pada drop area
        dropArea.classList.add('is-invalid');
        statusText.innerText = 'File terlalu besar (' + sizeMB + ' MB). Pilih file lain.';

        // Reset file input dan preview
        fileInput.value = '';
        currentFile = null;
        previewArea.style.display = 'none';
        uploadBtn.disabled = true;
      } else {
        // Jika ukuran file valid (<= 2MB)
        errorMessage.style.display = 'none';
        errorMessage.innerText = '';
        dropArea.classList.remove('is-invalid');

        currentFile = file;
        const sizeKB = (file.size / 1024).toFixed(1);
        statusText.innerText = file.name + ' (' + sizeKB + ' KB)';

        // Tampilkan preview gambar
        const reader = new FileReader();
        reader.onload = function(evt) {
          previewImg.src = evt.target.result;
          previewName.innerText = file.name + ' (' + sizeKB + ' KB)';
          previewArea.style.display = 'block';
          uploadBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      }
    });

    uploadBtn.addEventListener('click', async function() {
      if (!currentFile) return;

      uploadBtn.disabled = true;
      uploadBtn.innerText = 'Mengunggah...';

      const formData = new FormData();
      formData.append('file', currentFile);

      try {
        const res = await fetch('/api/v2/upload', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();
        if (res.ok) {
          alert('Upload Berhasil!\n' + (json.data?.link || json.message || ''));
          // Reset
          fileInput.value = '';
          currentFile = null;
          previewArea.style.display = 'none';
          statusText.innerText = 'Klik di sini untuk memilih gambar (Maks. 2MB)';
          uploadBtn.innerText = 'Upload ke Server';
        } else {
          alert('Upload Gagal: ' + (json.message || 'Error saat upload'));
          uploadBtn.disabled = false;
          uploadBtn.innerText = 'Upload ke Server';
        }
      } catch (err) {
        alert('File valid (' + (currentFile.size / 1024).toFixed(1) + ' KB) siap diupload ke server.');
        uploadBtn.disabled = false;
        uploadBtn.innerText = 'Upload ke Server';
      }
    });
  </script>
</body>
</html>
