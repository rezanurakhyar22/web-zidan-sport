<!DOCTYPE html>
<html lang="id">
<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><script src="/version-checker.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Reset Password User | Zidan Sport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa; --white: #ffffff; --primary: #16a34a; --primary-hover: #15803d;
      --primary-light: #dcfce7; --danger: #ef4444; --danger-light: #fee2e2;
      --border: #e5e7eb; --text: #111827; --muted: #6b7280;
      --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.07); --shadow-lg: 0 8px 32px rgba(0,0,0,0.13);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-brand span { font-weight: 700; font-size: 16px; color: var(--primary); }
    .header-badge { background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
    .header-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    #auth-gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
    .login-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
    .login-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    input[type="text"], input[type="email"], input[type="password"] { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: background 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-danger { background: var(--danger-light); color: var(--danger); padding: 6px 14px; font-size: 13px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; }
    .btn-danger:hover { background: #fecaca; }
    #main-content { display: none; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-wrap input { padding-left: 38px; }
    .table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f9fafb; }
    th { padding: 12px 16px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.3px; }
    td { padding: 12px 16px; font-size: 13px; color: var(--text); border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #16a34a, #059669); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-name { font-weight: 600; font-size: 13px; }
    .user-email { font-size: 11px; color: var(--muted); }
    .role-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; }
    .role-0 { background: #fef9c3; color: #854d0e; }
    .role-1 { background: var(--primary-light); color: var(--primary); }
    .role-2 { background: #e0f2fe; color: #0369a1; }
    .role-3 { background: #fce7f3; color: #be185d; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
    .page-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 420px; padding: 28px 28px 24px; box-shadow: var(--shadow-lg); margin: 16px; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-close { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
    .modal-user-chip { background: var(--primary-light); color: var(--primary); border-radius: 8px; padding: 8px 12px; margin-bottom: 20px; font-size: 13px; font-weight: 600; }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn-cancel { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--muted); }
    .btn-cancel:hover { background: var(--bg); }
    .btn-submit { flex: 2; padding: 10px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); max-width: 320px; animation: slideToast 0.25s ease; }
    @keyframes slideToast { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    .toast-success { background: #16a34a; color: #fff; }
    .toast-error { background: var(--danger); color: #fff; }
    .loading-row td { text-align: center; color: var(--muted); padding: 32px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .strength-bar { height: 4px; border-radius: 99px; background: #e5e7eb; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; transition: width 0.3s, background 0.3s; width: 0; }
    .strength-label { font-size: 11px; margin-top: 4px; }
    @media (max-width: 600px) { .hide-mobile { display: none; } .container { margin: 16px auto; } }
  </style>
</head>
<body>
<header class="header">
  <div class="header-brand">
    <span>Zidan Sport</span>
    <span class="header-badge">ADMIN</span>
  </div>
  <div class="header-user">
    <div class="avatar" id="admin-avatar">A</div>
    <span id="admin-name" class="hide-mobile">Administrator</span>
  </div>
</header>

<div id="auth-gate" class="container">
  <div class="login-card">
    <h2>Login Admin</h2>
    <p>Masuk untuk mengakses fitur reset password user.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@zidansport.org" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="login-error" style="color:#ef4444;font-size:13px;margin-bottom:12px;display:none;"></div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
      <span id="login-btn-text">Masuk</span>
    </button>
  </div>
</div>

<div id="main-content" class="container">
  <div class="page-title">Reset Password User</div>
  <div class="page-subtitle">Cari user dan reset password mereka sebagai admin.</div>
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search-input" placeholder="Cari nama atau email..." oninput="onSearch()" />
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th class="hide-mobile">Terdaftar</th>
          <th style="text-align:right">Aksi</th>
        </tr>
      </thead>
      <tbody id="user-table-body">
        <tr class="loading-row"><td colspan="4">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Reset Password</div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-user-chip" id="modal-user-info">-</div>
    <div class="field">
      <label>Password Baru</label>
      <input type="password" id="new-password" placeholder="Minimal 8 karakter" oninput="checkStrength()" />
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="strength-label" id="strength-label"></div>
    </div>
    <div class="field">
      <label>Konfirmasi Password</label>
      <input type="password" id="confirm-password" placeholder="Ulangi password baru" />
    </div>
    <div id="modal-error" style="color:#ef4444;font-size:13px;display:none;margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-submit" id="submit-btn" onclick="submitReset()">
        <span id="submit-btn-text">Reset Password</span>
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
  var API = 'https://api-v2.zidansport.org/api/v2';
  var token = null;
  var selectedUserId = null;
  var currentPage = 1;
  var totalPage = 1;

  function getCookie(name) {
    var m = document.cookie.match('(?:^|;)\\s*' + name + '=([^;]*)');
    return m ? decodeURIComponent(m[1]) : null;
  }

  function toast(msg, type) {
    type = type || 'success';
    var el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.innerHTML = '<span>' + (type === 'success' ? '&#10003;' : '&#10005;') + '</span><span>' + msg + '</span>';
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function() { el.remove(); }, 3500);
  }

  window.addEventListener('DOMContentLoaded', function() {
    token = getCookie('zs_v2_token');
    if (token) {
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      fetchUsers(1);
    }
    document.getElementById('login-password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  });

  function doLogin() {
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    if (!email || !password) { showLoginError('Email dan password wajib diisi.'); return; }
    var btn = document.getElementById('login-btn');
    var btnText = document.getElementById('login-btn-text');
    btnText.innerHTML = '<span class="spinner"></span> Masuk...';
    btn.disabled = true;
    document.getElementById('login-error').style.display = 'none';
    fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (!res.ok) throw new Error(res.data.message || 'Login gagal');
      if (res.data.data && res.data.data.access !== 0) throw new Error('Akun ini bukan admin.');
      token = res.data.data.access_token;
      var name = res.data.data.name || email;
      document.getElementById('admin-name').textContent = name;
      document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      fetchUsers(1);
    }).catch(function(err) {
      showLoginError(err.message);
    }).finally(function() {
      btnText.textContent = 'Masuk';
      btn.disabled = false;
    });
  }

  function showLoginError(msg) {
    var el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function fetchUsers(page) {
    currentPage = page || 1;
    var search = document.getElementById('search-input').value.trim();
    document.getElementById('user-table-body').innerHTML = '<tr class="loading-row"><td colspan="4">Memuat...</td></tr>';
    var params = 'page=' + currentPage + '&limit=15';
    if (search) params += '&search=' + encodeURIComponent(search);
    fetch(API + '/user?' + params, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(r) {
      if (r.status === 401) { token = null; document.getElementById('main-content').style.display = 'none'; document.getElementById('auth-gate').style.display = 'flex'; return null; }
      return r.json();
    }).then(function(data) {
      if (!data) return;
      totalPage = data.totalPage || 1;
      renderTable(data.data || []);
      renderPagination();
    }).catch(function() {
      document.getElementById('user-table-body').innerHTML = '<tr class="loading-row"><td colspan="4">Gagal memuat data.</td></tr>';
    });
  }

  var roleMap = { 0: ['Admin','role-0'], 1: ['Kontingen','role-1'], 2: ['Atlet','role-2'], 3: ['Pelatih','role-3'] };

  function renderTable(users) {
    if (!users.length) {
      document.getElementById('user-table-body').innerHTML = '<tr class="loading-row"><td colspan="4">Tidak ada user ditemukan.</td></tr>';
      return;
    }
    var html = users.map(function(u) {
      var initial = (u.name || u.email || '?').charAt(0).toUpperCase();
      var role = roleMap[u.access] || ['User','role-2'];
      var created = u.created_at ? new Date(u.created_at).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '-';
      var name = escHtml(u.name || '-');
      var email = escHtml(u.email || '-');
      var btnName = escHtml(u.name || u.email || '');
      return '<tr><td><div class="user-info"><div class="user-avatar">' + initial + '</div><div><div class="user-name">' + name + '</div><div class="user-email">' + email + '</div></div></div></td><td><span class="role-badge ' + role[1] + '">' + role[0] + '</span></td><td class="hide-mobile" style="color:var(--muted);font-size:12px">' + created + '</td><td style="text-align:right"><button class="btn-danger" onclick="openModal(' + u.id + ',\'' + btnName.replace(/'/g,"\\'") + '\')">Reset Password</button></td></tr>';
    }).join('');
    document.getElementById('user-table-body').innerHTML = html;
  }

  function renderPagination() {
    var el = document.getElementById('pagination');
    if (totalPage <= 1) { el.innerHTML = ''; return; }
    var html = '<button class="page-btn" onclick="fetchUsers(' + (currentPage-1) + ')"' + (currentPage<=1?' disabled':'') + '>&#8249;</button>';
    for (var i = 1; i <= totalPage; i++) {
      html += '<button class="page-btn' + (i===currentPage?' active':'') + '" onclick="fetchUsers(' + i + ')">' + i + '</button>';
    }
    html += '<button class="page-btn" onclick="fetchUsers(' + (currentPage+1) + ')"' + (currentPage>=totalPage?' disabled':'') + '>&#8250;</button>';
    el.innerHTML = html;
  }

  var searchTimeout;
  function onSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() { fetchUsers(1); }, 350);
  }

  function openModal(userId, userName) {
    selectedUserId = userId;
    document.getElementById('modal-user-info').textContent = 'User: ' + userName;
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('strength-fill').style.width = '0';
    document.getElementById('strength-label').textContent = '';
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function() { document.getElementById('new-password').focus(); }, 100);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    selectedUserId = null;
  }

  function checkStrength() {
    var pw = document.getElementById('new-password').value;
    var fill = document.getElementById('strength-fill');
    var label = document.getElementById('strength-label');
    var score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    var levels = [
      { pct:'0%', color:'#e5e7eb', text:'' },
      { pct:'25%', color:'#ef4444', text:'Terlalu lemah' },
      { pct:'50%', color:'#f97316', text:'Lemah' },
      { pct:'75%', color:'#eab308', text:'Cukup' },
      { pct:'100%', color:'#16a34a', text:'Kuat' }
    ];
    var l = levels[score] || levels[0];
    fill.style.width = l.pct; fill.style.background = l.color;
    label.textContent = l.text; label.style.color = l.color;
  }

  function submitReset() {
    var newPw = document.getElementById('new-password').value;
    var confirmPw = document.getElementById('confirm-password').value;
    if (!newPw || newPw.length < 8) { showModalError('Password minimal 8 karakter.'); return; }
    if (newPw !== confirmPw) { showModalError('Password dan konfirmasi tidak cocok.'); return; }
    if (!selectedUserId) return;
    var btn = document.getElementById('submit-btn');
    var btnText = document.getElementById('submit-btn-text');
    btnText.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
    document.getElementById('modal-error').style.display = 'none';
    fetch(API + '/user/' + selectedUserId + '/reset-password', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ new_password: newPw })
    }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (!res.ok) throw new Error(res.data.message || 'Gagal reset password');
      closeModal();
      toast(res.data.message || 'Password berhasil direset!', 'success');
    }).catch(function(err) {
      showModalError(err.message);
    }).finally(function() {
      btnText.textContent = 'Reset Password';
      btn.disabled = false;
    });
  }

  function showModalError(msg) {
    var el = document.getElementById('modal-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
